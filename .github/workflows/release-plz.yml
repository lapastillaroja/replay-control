name: Release-plz

on:
  push:
    branches: [main]

permissions:
  pull-requests: write
  contents: write

jobs:
  # DISABLED: versions (especially betas) and CHANGELOG.md are curated manually.
  # release-pr would propose automatic version bumps and changelog entries.
  # The former git_only workspace blocker (release-plz#2595) was fixed in 0.3.168;
  # it is no longer the reason this job is disabled. Revisit only if we choose to
  # automate version proposals, with changelog_update = false to preserve the
  # hand-written release notes.
  #
  # release-pr:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v7
  #       with:
  #         fetch-depth: 0
  #
  #     - uses: dtolnay/rust-toolchain@stable
  #
  #     - uses: release-plz/action@v0.5
  #       with:
  #         command: release-pr
  #       env:
  #         GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Create git tag + GitHub Release when version is bumped manually.
  # Release-plz checks if the current version already has a tag — if so, no-op.
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release-plz.outputs.releases_created }}
      tag: ${{ steps.release-plz.outputs.releases_created && fromJSON(steps.release-plz.outputs.releases)[0].tag || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - id: release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Chain the build workflow — tags created via GitHub API don't trigger push:tags events
  build:
    needs: release
    if: needs.release.outputs.released == 'true'
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
