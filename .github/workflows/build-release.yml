name: Build Release

on:
  push:
    tags: ['v*']
  workflow_call:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.3.0)'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v0.3.0)'
        required: true

permissions:
  contents: write

jobs:
  site:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-site

      - name: Restore downloaded data cache
        # Restore-only from the shared data/upstream cache (produced weekly by
        # refresh-upstream-data.yml); build.sh downloads on a cold cache.
        uses: actions/cache/restore@v6
        with:
          path: |
            data/upstream/
          key: data-upstream-latest
          restore-keys: data-upstream-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen brotli mold p7zip-full unzip

      - name: Install wasm-bindgen-cli
        run: cargo install wasm-bindgen-cli@0.2.129

      - name: Download TGDB lookup tables
        env:
          TGDB_API_KEY: ${{ secrets.TGDB_API_KEY }}
        run: ./scripts/download-tgdb-lookups.sh

      - name: Build catalog and browser
        run: ./build.sh --site-only

      - uses: actions/upload-artifact@v7
        with:
          name: release-site
          retention-days: 1
          path: |
            target/site/
            catalog.sqlite

  server:
    needs: site
    # Both jobs check out the tag at the same path and use the same toolchain.
    # The package step checks the native/browser server-function routes.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            build_arg: aarch64
            binary_dir: target/aarch64-unknown-linux-gnu/release
          - arch: amd64
            build_arg: amd64
            binary_dir: target/release
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.arch }}

      - uses: actions/download-artifact@v8
        with:
          name: release-site

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold
          if [[ '${{ matrix.arch }}' == arm64 ]]; then
            sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            sudo ln -sf /usr/bin/mold /usr/bin/aarch64-linux-gnu-ld.mold
          fi

      - name: Build ${{ matrix.arch }} server
        run: ./build.sh '${{ matrix.build_arg }}' --server-only

      - name: Pack server artifact
        run: tar -czf 'release-${{ matrix.arch }}.tar.gz' -C '${{ matrix.binary_dir }}' replay-control-app

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          retention-days: 1
          path: release-${{ matrix.arch }}.tar.gz

  flatpak:
    needs: server
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: actions/download-artifact@v8
        with:
          name: release-site

      - uses: actions/download-artifact@v8
        with:
          name: release-amd64

      - name: Restore server binary
        run: |
          mkdir -p target/release
          tar -xzf release-amd64.tar.gz -C target/release

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub \
            https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Build Flatpak bundle
        run: ./scripts/package-flatpak.sh

      - uses: actions/upload-artifact@v7
        with:
          name: release-flatpak
          retention-days: 1
          path: replay-control-*.flatpak

  publish:
    needs: [server, flatpak]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true

      - name: Restore server binaries
        run: |
          mkdir -p target/aarch64-unknown-linux-gnu/release target/release
          tar -xzf release-arm64.tar.gz -C target/aarch64-unknown-linux-gnu/release
          tar -xzf release-amd64.tar.gz -C target/release

      - name: Install package tools
        run: sudo apt-get update && sudo apt-get install -y dpkg-dev rpm

      - name: Package release archives
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          app_version=$(cargo metadata --no-deps --format-version 1 | \
            python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "replay-control-app"))')
          if [[ "$tag" != "v$app_version" ]]; then
            echo "Release tag $tag does not match app version v$app_version" >&2
            exit 1
          fi
          ./scripts/package-deb.sh "${{ inputs.tag || github.ref_name }}" arm64
          ./scripts/package-deb.sh "${{ inputs.tag || github.ref_name }}" amd64
          ./scripts/package-rpm.sh "${{ inputs.tag || github.ref_name }}"
          tar -czf replay-control-app-aarch64-linux.tar.gz \
              -C target/aarch64-unknown-linux-gnu/release \
              replay-control-app

          tar -czf replay-site.tar.gz \
              -C target \
              site

          tar -czf replay-catalog.tar.gz catalog.sqlite

          sha256sum \
              replay-control-app-aarch64-linux.tar.gz \
              replay-site.tar.gz \
              replay-catalog.tar.gz \
              replay-control_*_arm64.deb \
              replay-control_*_amd64.deb \
              replay-control-*-1.x86_64.rpm \
              replay-control-*.flatpak \
              install.sh \
              > checksums.sha256

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # A rerun may repair an incomplete draft, but replacing assets on a
          # published release would expose a mixed set during the upload.
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            if [[ $(gh release view "$TAG" --repo "${{ github.repository }}" --json isDraft --jq '.isDraft') != true ]]; then
              echo "Refusing to replace assets on published release $TAG" >&2
              exit 1
            fi
          else
            # A directly pushed tag can reach this workflow without a release.
            echo "Release $TAG not found — creating it."
            gh release create "$TAG" \
              --repo "${{ github.repository }}" \
              --title "$TAG" \
              --generate-notes \
              --draft
          fi
          gh release upload "$TAG" \
            replay-control-app-aarch64-linux.tar.gz \
            replay-site.tar.gz \
            replay-catalog.tar.gz \
            replay-control_*_arm64.deb \
            replay-control_*_amd64.deb \
            replay-control-*-1.x86_64.rpm \
            replay-control-*.flatpak \
            install.sh \
            checksums.sha256 \
            --clobber

          # Check what GitHub actually serves while the release is still a
          # draft. All release assets are covered by checksums.sha256.
          release_assets_dir=$(mktemp -d)
          trap 'rm -rf "$release_assets_dir"' EXIT
          gh release download "$TAG" \
            --repo "${{ github.repository }}" \
            --dir "$release_assets_dir"
          cmp checksums.sha256 "$release_assets_dir/checksums.sha256"
          (cd "$release_assets_dir" && sha256sum -c checksums.sha256)
          expected_assets=$(awk '{print $2}' checksums.sha256 | sort)
          actual_assets=$(find "$release_assets_dir" -maxdepth 1 -type f \
            ! -name checksums.sha256 -printf '%f\n' | sort)
          if [[ "$actual_assets" != "$expected_assets" ]]; then
            echo "Release asset set does not match checksums.sha256" >&2
            exit 1
          fi

          # release-plz created the release as a draft (git_release_draft).
          # Publish only after the uploaded assets pass checksum verification.
          # SemVer prerelease tags (vX.Y.Z-foo) are badged as prerelease and kept
          # out of /releases/latest; stable tags become the latest release.
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --draft=false \
              --prerelease \
              --latest=false
          else
            gh release edit "$TAG" \
              --repo "${{ github.repository }}" \
              --draft=false \
              --prerelease=false \
              --latest
          fi
